[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[package]
name = "tg_daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
futures = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tdlib = "0.10.0"
tokio = {version = "1.48.0", features = ["full"]}
x11rb = "0.13.2"
zbus = {version = "5.12.0", features = ["tokio"]}
zbus_macros = "5.12.0"

